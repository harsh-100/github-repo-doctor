[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "github-repo-doctor"
version = "0.1.0"
description = "AI-powered repository analysis agent that runs locally."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["code-review", "static-analysis", "llm", "agents", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "pydantic>=2",
  "httpx>=0.27",
  "pathspec>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
tools = ["ruff>=0.5", "bandit>=1.7"]

[project.urls]
Homepage = "https://github.com/USERNAME/github-repo-doctor"
Issues = "https://github.com/USERNAME/github-repo-doctor/issues"

[project.scripts]
repo-doctor = "repo_doctor.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
